<!doctype html>
<html lang="en" data-font="playful">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ta-Done!</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15233B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ta-Done!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/ta-done/manifest.webmanifest">
<link rel="icon" type="image/png" href="/ta-done/icon-192.png">
<link rel="apple-touch-icon" href="/ta-done/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Focus palette. Each colour has one job, so meaning is read at a glance:
   navy = structure, blue = interactive/info, mint-green = progress and "go",
   amber = needs attention soon, red = urgent only. Cool low-saturation base keeps arousal low for sustained focus. */
:root{
  --bg:#EEF2F6;--frame:#E2E8F0;--card:#FFFFFF;--card2:#F5F7FA;--line:#E1E6ED;--ink:#142033;--ink2:#4B5768;--ink3:#677283;--soft:#E8EDF3;
  --lime:#7EE2B8;--on-lime:#0A3324;--slate:#C9D6E6;--on-slate:#0F1B2D;--pri:#15233B;--on-pri:#FFFFFF;
  --coral:#E8572F;--teal:#0B7650;--teal-bg:#DCF5EA;--amber:#9A5800;--amber-bg:#FFF1D6;--red:#C41F2E;--red-bg:#FFE5E7;--lav:#2F5BEA;--lav-bg:#E6EDFF;
  --period:#E0457A;--period-bg:#FFE3EC;--on-c:#FFFFFF;--tint:14%;
  --shadow:0 1px 2px rgba(20,32,51,.04),0 14px 34px -24px rgba(20,32,51,.30);
  --fd:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;--fh:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--hw:600;
  --r:22px;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-font="friendly"]{--fd:'Nunito',system-ui,sans-serif;--fh:'Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--hw:800}
:root[data-font="clean"]{--fd:'Manrope',system-ui,sans-serif;--fh:'Manrope',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif;--hw:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131C;--frame:#121A26;--card:#161F2C;--card2:#1C2736;--line:#273345;--ink:#E7ECF3;--ink2:#A6B1C2;--ink3:#8592A5;--soft:#222D3D;
  --lime:#6EE0AE;--on-lime:#062418;--slate:#33465F;--on-slate:#E7ECF3;--pri:#6EE0AE;--on-pri:#062418;
  --coral:#FF8A65;--teal:#4FD1A0;--teal-bg:#123327;--amber:#F5B347;--amber-bg:#352710;--red:#FF6B74;--red-bg:#3B1C22;--lav:#8FAEFF;--lav-bg:#1D2A48;
  --period:#FF7AA2;--period-bg:#3E1E2B;--on-c:#0D131C;--tint:22%;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -24px rgba(0,0,0,.8);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D131C;--frame:#121A26;--card:#161F2C;--card2:#1C2736;--line:#273345;--ink:#E7ECF3;--ink2:#A6B1C2;--ink3:#8592A5;--soft:#222D3D;
  --lime:#6EE0AE;--on-lime:#062418;--slate:#33465F;--on-slate:#E7ECF3;--pri:#6EE0AE;--on-pri:#062418;
  --coral:#FF8A65;--teal:#4FD1A0;--teal-bg:#123327;--amber:#F5B347;--amber-bg:#352710;--red:#FF6B74;--red-bg:#3B1C22;--lav:#8FAEFF;--lav-bg:#1D2A48;
  --period:#FF7AA2;--period-bg:#3E1E2B;--on-c:#0D131C;--tint:22%;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -24px rgba(0,0,0,.8);color-scheme:dark;}
[style*="--c0"]{--c:var(--c0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [style*="--c0"]{--c:color-mix(in srgb,var(--c0) 70%,#fff)}}
:root[data-theme="dark"] [style*="--c0"]{--c:color-mix(in srgb,var(--c0) 70%,#fff)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:var(--lav);font-weight:700}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--fh);font-weight:var(--hw);margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.8rem,4.2vw,2.5rem);line-height:1.08}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--fh);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.display{font-family:var(--fd);font-weight:400;letter-spacing:.005em;line-height:.95;text-transform:uppercase}
:root[data-font="friendly"] .display,:root[data-font="clean"] .display{font-weight:800;text-transform:none;letter-spacing:-.02em}
.muted{color:var(--ink2)}
.small{font-size:.875rem}
.ico{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.25em}
.badge{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),transparent)}
.badge .ico{width:19px;height:19px}
.badge.sm{width:26px;height:26px;border-radius:9px}.badge.sm .ico{width:15px;height:15px}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100%}
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:space-around;
  background:var(--pri);border-radius:24px;padding:6px;box-shadow:0 12px 30px -12px rgba(20,10,60,.5)}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:color-mix(in srgb,var(--on-pri) 70%,transparent);min-height:52px}
nav.tabs button .ico{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--on-lime);background:var(--lime)}
nav.tabs .brand,nav.tabs .deskonly{display:none}
nav.tabs .mobnav{display:flex}
.mobonly{display:inline-flex}
main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:18px 14px 110px}
@media (min-width:900px){
  .app{padding:18px;gap:18px}
  nav.tabs{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));left:auto;right:auto;bottom:auto;align-self:flex-start;height:calc(100vh - 36px);flex-direction:column;justify-content:flex-start;
    width:92px;flex:none;border-radius:30px;padding:16px 10px;gap:6px;background:var(--frame);box-shadow:none}
  nav.tabs button{flex:none;font-size:.7rem;padding:8px 2px;min-height:0;color:var(--ink2);border-radius:18px}
  nav.tabs button .ico{width:22px;height:22px}
  nav.tabs button[aria-current="page"]{background:var(--pri);color:var(--on-pri)}
  nav.tabs .brand{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;margin:0 auto 14px;overflow:hidden;border:3px solid var(--card);padding:0;background:var(--lime);color:var(--on-lime);font-weight:800;font-size:1.5rem;flex:none;min-height:0}
  nav.tabs .brand img{width:100%;height:100%;object-fit:cover}
  nav.tabs .brand svg{width:40px;height:40px}
  nav.tabs .deskonly{display:flex}
  nav.tabs .mobnav{display:none}
  nav.tabs .spacer{flex:1}
  .mobonly{display:none!important}
  main{padding:8px 4px 40px}
}

/* ---------- Running bar ---------- */
.runbar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:15;margin:0 0 18px;background:#262040;color:#FFFFFF;--on-pri:#FFFFFF;border-radius:22px;
  padding:10px 12px 10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;box-shadow:var(--shadow)}
.runbar .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.runbar .who small{font-weight:500;opacity:.75}
.runbar .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.runbar .clk{font-size:1.5rem;min-width:5.2ch}
.runbar input{flex:1 1 180px;min-width:0;border:0;background:color-mix(in srgb,var(--on-pri) 12%,transparent);color:inherit;border-radius:14px;padding:9px 12px}
.runbar input::placeholder{color:color-mix(in srgb,var(--on-pri) 60%,transparent)}
.runbar .btn{background:color-mix(in srgb,var(--on-pri) 14%,transparent);border-color:transparent;color:inherit}
.runbar .btn.primary{background:var(--lime);color:var(--on-lime)}
.runbar .paused{font-weight:700;font-size:.85rem;opacity:.8}
.runbars{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:15;margin:0 0 18px;display:grid;gap:8px}
.runbars .runbar{position:static;margin:0}
@media (max-width:640px){.runbars.multi{position:static}}
.longrun{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--lime) 22%,transparent);border-radius:14px;padding:8px 10px;font-size:.9rem}
.longrun .field{background:var(--card);color:var(--ink);min-height:36px;padding:4px 8px}

/* ---------- Controls ---------- */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:.85rem}
.btn.icon{width:38px;padding:0}
.field{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 13px;min-height:44px;min-width:0}
textarea.field{min-height:80px;resize:vertical;width:100%;line-height:1.55}
.field:focus{border-color:var(--lav);outline:none}
.lbl{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin:0 0 5px}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--lav)}
.seg{display:inline-flex;background:var(--frame);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 15px;font-weight:700;color:var(--ink2);display:flex;gap:6px;align-items:center;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.pill{border:0;border-radius:12px;padding:7px 12px;font-weight:700;font-size:.85rem;background:color-mix(in srgb,#fff 22%,transparent);color:inherit}
.pill[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}

/* ---------- Layout ---------- */
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 20px}
.hello .sub{color:var(--ink2);font-weight:500;margin-top:4px}
.kpis{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.kpi span{display:block;font-size:.78rem;color:var(--ink2);font-weight:600}
.kpi b{font-size:1.6rem;line-height:1.1}
.kpi b small{font-size:.85rem;color:var(--ink2);font-weight:600;margin-left:3px}
section{margin-bottom:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel.tint{background:var(--card2);box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
.stack{display:grid;gap:18px;align-content:start}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.grid2.even{grid-template-columns:1fr 1fr}.grid2.side{grid-template-columns:minmax(310px,1fr) minmax(0,2.3fr)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .field{flex:1 1 160px}
.empty{color:var(--ink2);padding:6px 0}
.notice{background:var(--card);border-radius:18px;padding:12px 14px;font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px;box-shadow:var(--shadow);border-left:6px solid var(--lav)}
.notice.warm{border-left-color:var(--amber)}
.notice.rest{border-left-color:var(--lav);color:var(--lav)}
.notice.period{border-left-color:var(--period)}

/* ---------- Mood hero ---------- */
.mood{border-radius:32px;overflow:hidden;background:var(--mbg);color:var(--mfg);position:relative;padding:0 0 18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mood .char{display:block;width:100%;height:auto;max-height:210px}
.mood .txt{padding:0 20px;text-align:center}
.mood h2.display{font-size:clamp(2.2rem,6vw,3.1rem)}
.mood .date{font-weight:800;margin:8px 0 14px}
.mood .levels{display:flex;justify-content:center;gap:5px;margin:0 14px 10px;flex-wrap:wrap}
.mood .lv{border:0;border-radius:16px;background:color-mix(in srgb,#fff 22%,transparent);padding:4px 4px 6px;width:52px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.72rem;font-weight:800;color:inherit}
.mood .lv svg{width:40px;height:34px}
.mood .lv[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.mood .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 14px}
.mood .pill{background:color-mix(in srgb,#000 12%,transparent)}
.mood .pill[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.mood .mnote{margin:12px 16px 0;background:color-mix(in srgb,#fff 25%,transparent);border:0;color:inherit;border-radius:14px;padding:10px 12px}
.mood .mnote::placeholder{color:inherit;opacity:.7}

/* ---------- Activity cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
@media (max-width:460px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.act{background:var(--card);border-radius:var(--r);padding:14px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:var(--shadow)}
.act-top{display:flex;align-items:center;gap:9px;align-self:stretch;min-height:34px;text-align:left}
.act-top h3{font-weight:700;font-family:var(--fb);font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.ring-wrap{position:relative;width:126px;height:126px;margin:4px 0}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--soft);stroke-width:11}
.ring .prog{fill:none;stroke:var(--c);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.act.done .ring .prog{stroke:var(--teal)}
.act.done{background:var(--teal-bg);color:var(--ink)}
.act.done .amt,.act.done .amt b{color:var(--ink)}
.act.done .status{color:var(--teal);font-weight:800}
.act.done .ring .track{stroke:color-mix(in srgb,var(--teal) 18%,transparent)}
.act.rest .ring .track{stroke:var(--lav-bg)}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:var(--c);color:var(--on-c);display:grid;place-items:center;transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:26px;height:26px}
.act.running .play{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 22%,transparent)}
.act.paused .play{background:var(--card);color:var(--c);border:3px solid var(--c)}
.amt{font-weight:600;color:var(--ink2);font-size:.9rem}
.amt b{font-size:1.5rem;color:var(--ink)}
.status{font-size:.82rem;color:var(--ink2);min-height:1.3em;font-weight:600}
.act.running .status{color:var(--c);font-weight:800}
.act.rest .status{color:var(--lav)}
.streak{font-size:.75rem;font-weight:800;color:var(--on-lime);background:var(--lime);border-radius:999px;padding:2px 10px}
@media (max-width:460px){.ring-wrap{width:108px;height:108px}.act{padding:12px 8px}}

/* ---------- Tasks ---------- */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink3);background:none;display:grid;place-items:center;margin-top:1px;padding:0;color:var(--on-lime)}
.check:hover{border-color:var(--teal)}
.task.isdone .check,.subs li.d .check{background:var(--lime);border-color:var(--lime)}
.task.isdone .ttl{text-decoration:line-through;color:var(--ink3)}
.task .body{flex:1;min-width:0}
.task .ttl{font-weight:700;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.task .ttl:hover{color:var(--lav)}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.task.urgent .ttl{color:var(--red)}
.chip{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);display:inline-flex;gap:4px;align-items:center}
.chip.urgent{background:var(--red);color:#fff}
.chip.high{background:color-mix(in srgb,var(--coral) 18%,transparent);color:var(--coral)}
.chip.low{color:var(--ink3)}
.chip.soon{background:var(--amber-bg);color:var(--amber)}
.chip.imp{background:var(--lav-bg);color:var(--lav)}
.chip.ok{background:var(--teal-bg);color:var(--teal)}
.chip.late{background:var(--red-bg);color:var(--red)}
.chip.stuck{background:var(--amber-bg);color:var(--amber)}
.chip.lime{background:var(--lime);color:var(--on-lime)}
.chip .ico{width:13px;height:13px}
.x,.star{border:0;background:none;color:var(--ink3);width:34px;height:34px;border-radius:12px;font-size:1.1rem;flex:none;display:grid;place-items:center;padding:0}
.x:hover{background:var(--soft);color:var(--red)}
.star:hover{background:var(--soft);color:var(--amber)}
.star[aria-pressed="true"]{color:#E9A100}
.star .ico{width:19px;height:19px}
.star[aria-pressed="true"] .ico{fill:currentColor}
.roll{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.roll input{padding:4px 8px;min-height:34px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.editor{flex-basis:100%;background:var(--card2);border-radius:20px;padding:14px;margin:6px 0 4px;display:grid;gap:12px}
.editor .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.editor .field{width:100%}
.subs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.subs li{display:flex;align-items:center;gap:8px}
.subs li.d span{text-decoration:line-through;color:var(--ink3)}
.subs .check{width:22px;height:22px}
.hist{font-size:.85rem;color:var(--ink2);display:grid;gap:2px}

/* ---------- Bars, stats, heat ---------- */
.wk{display:grid;gap:12px}
.wk .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.wk .bar{grid-column:1/-1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.wk .bar span{display:block;height:100%;background:var(--c);border-radius:999px}
.wk .bar.met span{background:var(--lime)}
.wk .name{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.wk .val{font-size:.85rem;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.82rem;color:var(--ink2);font-weight:600}
.stat.hl{background:var(--lime);color:var(--on-lime)}.stat.hl span{color:var(--on-lime);opacity:.8}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:4px;background:var(--soft)}
.heat i.l1{background:color-mix(in srgb,var(--lav) 30%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--lav) 60%,var(--soft))}
.heat i.l3{background:var(--lav)}
.heat i.l4{background:var(--lime)}
.heat i.r{box-shadow:inset 0 0 0 2px var(--ink3)}
.heat i.f{background:none}
.legend{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink2);flex-wrap:wrap;margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- Time log ---------- */
.day{margin-bottom:18px}
.day h3{font-size:1rem;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.entry{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.entry .note{grid-column:2/-1;border:1.5px dashed transparent;background:none;padding:4px 6px;margin-left:-6px;border-radius:10px;font-size:.9rem;color:var(--ink2);width:100%}
.entry .note:hover,.entry .note:focus{border-color:var(--line);outline:none;background:var(--card2)}
.tag{font-size:.72rem;font-weight:800;color:var(--lav);background:var(--lav-bg);padding:1px 8px;border-radius:999px;margin-left:6px}
.tlog{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.tlog th{text-align:left;font-size:.78rem;color:var(--ink2);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line)}
.tlog td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tlog td.t{font-weight:700}
.scroll{overflow-x:auto}

/* ---------- Jobs ---------- */
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .co{font-weight:800}
.job .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.job .opts .field{min-height:36px;padding:5px 10px;border-radius:12px;font-size:.88rem}
.job .opts input.notes{flex:1 1 200px}
.stage-h{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-weight:800;color:var(--ink2);font-size:.9rem}

/* ---------- Calendar ---------- */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.82rem}
.mini .dn{color:var(--ink3);font-weight:700;font-size:.72rem;padding:4px 0}
.mini button{border:0;background:none;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;font-weight:600;position:relative;padding:0}
.mini button:hover{background:var(--soft)}
.mini button.o{color:var(--ink3)}
.mini button.t{background:var(--lime);color:var(--on-lime);font-weight:800}
.mini button.s{box-shadow:inset 0 0 0 2px var(--pri)}
.mini button.p::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--period)}
.mini button.pp::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--period)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .dn{font-size:.75rem;font-weight:800;color:var(--ink2);text-align:center;padding:2px 0}
.mcell{min-height:96px;background:var(--card2);border-radius:16px;padding:7px;text-align:left;border:0;display:flex;flex-direction:column;gap:4px;font-size:.75rem;position:relative}
.mcell.o{opacity:.45}
.mcell .dnum{font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.mcell.t .dnum span{background:var(--lime);color:var(--on-lime);border-radius:999px;padding:0 7px}
.mcell .per{height:6px;border-radius:999px;background:var(--period)}
.mcell .per.pred{background:none;border:1.5px dashed var(--period);height:7px}
.mcell .mini-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-weight:600}
.mdot{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block}
@media (max-width:640px){.mcell{min-height:64px;padding:5px;border-radius:12px}.mcell .hide-sm{display:none}}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.wcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol .wh{text-align:center;padding:6px 0 8px;border-radius:16px}
.wcol .wh b{display:block;font-size:1.35rem;line-height:1.1}
.wcol .wh span{font-size:.75rem;color:var(--ink2);font-weight:700}
.wcol.t .wh{background:var(--pri);color:var(--on-pri)}.wcol.t .wh span{color:inherit;opacity:.75}
.blk{border-radius:14px;padding:8px 10px;font-size:.78rem;font-weight:600;background:var(--card2);border:0;text-align:left;width:100%}
.blk b{display:block;font-size:.85rem;font-weight:700;overflow-wrap:anywhere}
.blk.s{background:var(--lime);color:var(--on-lime)}
.blk.s:nth-of-type(even){background:var(--slate);color:var(--on-slate)}
.blk.tk{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.blk.tk.dn b{text-decoration:line-through;opacity:.6}
.blk.j{background:var(--lav-bg);color:var(--lav)}
.blk.per{background:var(--period-bg);color:var(--period)}
.tl{display:grid;gap:8px}
.tl .it{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:start}
.tl .tm{font-size:.82rem;color:var(--ink2);font-weight:700;padding-top:9px;text-align:right}

/* ---------- Journal ---------- */
.jtypes{display:flex;flex-wrap:wrap;gap:8px}
.jt{border:0;border-radius:999px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--ink2);font-size:.9rem;box-shadow:var(--shadow)}
.jt .ico{color:var(--c)}
.jt[aria-pressed="true"]{background:var(--c);color:#fff}
.jt[aria-pressed="true"] .ico{color:#fff}
.jgrid{columns:2 300px;column-gap:16px}
.jcard{break-inside:avoid;margin:0 0 16px;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border-top:6px solid var(--c);display:block;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.jcard .jmeta{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink2);margin-bottom:6px}
.jcard .jmeta .k{color:var(--c)}
.jcard h3{margin-bottom:4px}
.jcard p{white-space:pre-wrap;color:var(--ink);font-size:.95rem;overflow-wrap:anywhere}
.jedit{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:8px solid var(--c);display:grid;gap:12px;margin-bottom:18px}
.jedit textarea.field{min-height:220px;font-size:1.02rem}
.jprompt{background:var(--card2);border-radius:14px;padding:10px 12px;font-size:.92rem;color:var(--ink2)}
.qj{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.qj button{border:0;border-radius:18px;padding:12px;text-align:left;font-weight:700;background:color-mix(in srgb,var(--c) var(--tint),var(--card));color:var(--ink);display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.qj button .ico{color:var(--c);width:22px;height:22px}

/* ---------- Cycle ---------- */
.cyc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.cycring{width:120px;height:120px;position:relative}
.cycring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cycring .c-in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.cycring .c-in b{font-size:2rem;display:block}
.cycring .c-in span{font-size:.72rem;font-weight:700;color:var(--ink2)}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.flow button,.symp button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem}
.flow button[aria-pressed="true"]{background:var(--period);border-color:var(--period);color:#fff}
.symp{display:flex;gap:6px;flex-wrap:wrap}
.symp button[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mgrid i{aspect-ratio:1;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.mgrid i svg{width:80%;height:80%}

/* ---------- Settings & misc ---------- */
.actrow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.actrow .field{width:100%;padding:8px 10px;min-height:42px}
.actrow .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--sw);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.ip{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink2);padding:0}
.ip .ico{width:19px;height:19px}
.ip[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),transparent)}
.fontprev{font-family:var(--pf);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles button{border:0;background:var(--card);border-radius:24px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:1.05rem;box-shadow:var(--shadow);min-height:120px}
.tiles button .badge{width:42px;height:42px;border-radius:14px}
.tiles button small{font-weight:500;color:var(--ink2);font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--card);
  border-radius:18px;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:700;max-width:calc(100% - 24px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast button{background:none;border:0;color:var(--lime);font-weight:800}
:root[data-theme="light"] .toast button{color:#9BC400}
@media (min-width:900px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.center{min-height:60vh;display:grid;place-items:center;text-align:center}
.center .panel{max-width:460px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-weight:700;color:var(--ink2);padding:6px 0}
.disclaimer{font-size:.8rem;color:var(--ink3);margin-top:10px}

/* ---------- Ta-Done additions ---------- */
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.appbar .logo{width:36px;height:36px;border-radius:50%;border:0;padding:0;background:var(--lime);color:var(--on-lime);font-weight:800;overflow:hidden;display:grid;place-items:center;flex:none}
.appbar .logo img{width:100%;height:100%;object-fit:cover}.appbar .logo svg{width:30px;height:30px}
.appbar .name{font-family:var(--fd);font-size:1.25rem;letter-spacing:.01em;text-transform:uppercase}
:root[data-font="friendly"] .appbar .name,:root[data-font="clean"] .appbar .name{text-transform:none;font-weight:800}
.appbar .sp{flex:1}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:800;border:0;padding:0;flex:none;font-size:1.05rem}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:2rem}
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:820px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.dash .w.full{grid-column:1/-1}}
.dash .w{position:relative;min-width:0}
.dash .w > section,.dash .w > .panel{margin:0}
.dash.editing .w{outline:2.5px dashed var(--lav);outline-offset:6px;border-radius:var(--r)}
.dash.editing .w.over{outline-color:var(--lime);outline-style:solid}
.wbar{display:flex;align-items:center;gap:6px;background:var(--pri);color:var(--on-pri);border-radius:999px;padding:5px 6px 5px 12px;margin-bottom:8px;font-weight:700;font-size:.85rem}
.wbar .grab{cursor:grab;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.wbar button{border:0;background:color-mix(in srgb,var(--on-pri) 14%,transparent);color:inherit;border-radius:999px;min-width:34px;height:32px;padding:0 10px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:4px}
.hiddenw{display:flex;flex-wrap:wrap;gap:8px}
.flame{display:inline-block;flex:none}
.streakw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.streakw .big{display:flex;align-items:center;gap:4px}
.streakw .big svg{width:62px;height:62px}
.streakw .big b{font-size:3rem;line-height:1}
.wdots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.wdots span{width:34px;text-align:center;font-size:.7rem;font-weight:700;color:var(--ink2)}
.wdots i{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--soft);margin-bottom:3px}
.wdots i.on{background:#FFE7CF}.wdots i.r{background:var(--lav-bg)}
:root[data-theme="dark"] .wdots i.on{background:#4A2C12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wdots i.on{background:#4A2C12}}
.wdots i svg{width:20px;height:20px}
.streak{display:inline-flex;align-items:center;gap:3px}
.streak svg{width:14px;height:14px}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ovc{background:var(--card2);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}
.ovc.dk{background:var(--pri);color:var(--on-pri);--ovring:var(--lime)}
:root[data-theme="dark"] .ovc.dk{--ovring:#15121F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ovc.dk{--ovring:#15121F}}.ovc.dk .muted{color:inherit;opacity:.75}
.ovring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ovc b{font-size:1.5rem;display:block;line-height:1.1}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:14px}
.bars7 div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars7 .b{width:100%;max-width:34px;border-radius:10px;background:var(--slate);min-height:4px}
.bars7 .b.t{background:var(--lime)}
.bars7 span{font-size:.72rem;font-weight:700;color:var(--ink2)}
.bars7 em{font-style:normal;font-size:.72rem;font-weight:800}
.captype{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.captype button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.captype button .ico{width:15px;height:15px}
.captype button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;min-width:46px;height:42px;font-weight:800}
.rate button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.catrow .field{width:100%;min-height:40px;padding:7px 10px}
.catrow .more{grid-column:1/-1;display:grid;gap:8px}
.catrow.off{opacity:.55}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1.5px dashed var(--line);background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.sugg button .ico{color:var(--c);width:16px;height:16px}
.uprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logoprev{width:84px;height:84px;border-radius:24px;overflow:hidden;background:var(--card2);display:grid;place-items:center}
.logoprev img{width:100%;height:100%;object-fit:cover}.logoprev svg{width:56px;height:56px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tinfo{margin-top:4px;font-size:.8rem;color:var(--ink2)}
.tinfo summary{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink3);padding:2px 0;list-style:none;cursor:pointer}
.tinfo summary::-webkit-details-marker{display:none}
.tinfo summary::before{content:'';width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:3px;transition:transform .15s}
.tinfo[open] summary::before{transform:rotate(45deg)}
.tinfo dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 2px;background:var(--card2);border-radius:12px;padding:8px 12px}
.tinfo dt{font-weight:800;color:var(--ink2)}.tinfo dd{margin:0;color:var(--ink)}

/* Wobbly mood eyes */
.pupils{animation:peek 5.5s cubic-bezier(.34,1.56,.64,1) infinite;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.tracking .pupils{animation:none}
@keyframes peek{0%,8%{transform:translate(0,0)}14%,30%{transform:translate(5px,-2px)}36%,52%{transform:translate(-5px,1px)}58%{transform:translate(-4px,3px) rotate(0)}62%{transform:translate(-2px,-1px)}66%{transform:translate(-4px,2px)}70%,86%{transform:translate(2px,4px)}92%,100%{transform:translate(0,0)}}
@keyframes blink{0%,44%,50%,93%,100%{transform:scaleY(1)}46.5%,96%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(3px) scaleY(.985)}}
/* Resizable dashboard */
@media (min-width:820px){.dash{grid-template-columns:repeat(12,minmax(0,1fr))}.dash .w{grid-column:span var(--span,6)}.dash .w.full{grid-column:span var(--span,12)}}
.wc.fix{overflow:auto;border-radius:var(--r);overscroll-behavior:contain}
.wc.fix > section{min-height:100%}
@media (max-width:819px){.wc.fix{height:auto!important;overflow:visible}}
.rsz{display:none}
@media (min-width:820px){.dash.editing .rsz{display:block;position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:10px;background:var(--lime);cursor:nwse-resize;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:none}
  .dash.editing .rsz::after{content:'';position:absolute;inset:8px;border-right:2.5px solid var(--on-lime);border-bottom:2.5px solid var(--on-lime);border-radius:0 0 3px 0}}
.dkonly{display:none!important}
@media (min-width:820px){.dkonly{display:inline-flex!important}}
.dash.resizing{user-select:none;cursor:nwse-resize}

/* Board rows and stacked columns */
.board{display:grid;gap:18px}
.brow{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.bcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.bcol > .w > .wc > section,.bcol > .w > .wc > .panel{margin:0}
@media (min-width:820px){.brow{grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}.bcol{grid-column:span var(--span,12)}.rowbar{grid-column:1/-1}}
.board.editing .brow{background:color-mix(in srgb,var(--lav) 8%,transparent);border-radius:28px;padding:12px}
.board.editing .bcol{outline:2px dashed color-mix(in srgb,var(--lav) 55%,transparent);outline-offset:4px;border-radius:22px;min-height:80px}
.board.editing .bcol.over{outline:2.5px solid var(--lime)}
.board.editing .w.over{box-shadow:0 -4px 0 0 var(--lime);border-radius:var(--r)}
.rowbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowbar .field{min-height:36px;padding:5px 10px;border-radius:12px}
.dropspot{border:2px dashed var(--lav);border-radius:20px;min-height:90px;display:grid;place-items:center;color:var(--lav);font-weight:700;font-size:.9rem}
.board .w{position:relative}

.thm:hover{color:var(--ink);transform:rotate(-15deg)}
.thm .ico{width:19px;height:19px}
.wnbox{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);border-left:6px solid var(--lime);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.wnbox > div:first-child{display:flex;flex-direction:column;gap:2px;flex:1 1 240px}
.wnbox small{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.wnbox b{font-size:1.15rem;overflow-wrap:anywhere}
.wnbox .chip .ico{width:13px;height:13px}
.nextstep{display:block;font-size:.84rem;color:var(--lav);font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.nextstep.muted{color:var(--ink3);font-weight:600}
.wnbtn{min-height:40px;align-self:center}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;background:var(--card2);border-radius:12px;padding:8px 12px}
.plist b{font-variant-numeric:tabular-nums}
.burst{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.burst span{position:absolute;top:-16px;width:7px;height:12px;border-radius:2px;animation:burstfall 2s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes burstfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(560deg);opacity:.9}}
@media (max-width:640px){.kpis.stable{flex-wrap:wrap}.wnbtn{order:-1;flex-basis:100%}}
@media (max-width:819px){.arrange-mob{display:flex;justify-content:center;margin-top:16px}}
/* Work mode */
.wm{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.82rem;min-height:36px}
.wm .ico{width:16px;height:16px}
.wm[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.top-hint{background:var(--card2);border-radius:14px;padding:10px 12px;font-size:.9rem;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.top-hint .ico{color:#E9A100;width:18px;height:18px;margin-top:2px}

/* ---------- Focus redesign: type and colour layer ---------- */
/* Lexend headings (open, low-stress letterforms) + Figtree text (compact, legible, true tabular figures so ticking timers never jitter). */
body{font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.02em}
h1{font-weight:600;font-size:clamp(1.7rem,3.6vw,2.25rem);line-height:1.12}
h2{font-size:1.05rem;font-weight:600}
h3{font-weight:600}
.num{font-family:var(--fb)}
.num,.clk,.kpi b,.stat b,.amt b,.gtm,.htab .tm{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.display{font-weight:700;text-transform:none;letter-spacing:-.03em;line-height:1.08}
.appbar .name{text-transform:none;font-weight:700;letter-spacing:-.02em;font-size:1.1rem}
.wbig{font-weight:700;text-transform:none;letter-spacing:-.035em;line-height:1.02}
.wnum,.wgrid b,.wlist li span{font-weight:700;letter-spacing:-.03em}
.lbl{font-weight:600;letter-spacing:.005em}
.muted{color:var(--ink2)}
.kpi span,.stat span{font-weight:500}
.sec-head h2{display:flex;align-items:center;gap:8px}

/* Surfaces: quiet cards on a cool mist base, hairline edge instead of heavy shadow */
.panel,.act,.jcard,.jedit,.notice,.wnbox,.rowbar,.tiles button{box-shadow:var(--shadow);outline:1px solid color-mix(in srgb,var(--line) 70%,transparent);outline-offset:-1px}
.panel.tint{outline:0}
.act.done{outline-color:color-mix(in srgb,var(--teal) 30%,transparent)}

/* Controls: one tactile press, no layout animation */
.btn,.play,.check,.seg button,.pill,.jt,.lay{transition:transform .15s cubic-bezier(.16,1,.3,1),background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:active:not(:disabled),.seg button:active,.pill:active,.jt:active{transform:translateY(1px) scale(.985)}
.btn{font-weight:600}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--pri) 88%,var(--card));border-color:transparent}
.btn.lime:hover:not(:disabled){background:color-mix(in srgb,var(--lime) 85%,var(--ink));border-color:transparent}
.field{border-width:1.5px}
.field:focus{border-color:var(--lav);box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 18%,transparent)}
:focus-visible{outline-color:var(--lav)}
.field::placeholder{color:var(--ink3)}

/* Navigation */
@media (min-width:900px){
  nav.tabs{background:var(--card);outline:1px solid var(--line);outline-offset:-1px}
  nav.tabs button:not([aria-current="page"]):hover{background:var(--soft);color:var(--ink)}
}

/* Running timer bar stays deep navy in both themes so a live timer is always the strongest thing on screen */
.runbar{background:#15233B;box-shadow:0 14px 34px -18px rgba(20,32,51,.55)}
:root[data-theme="dark"] .runbar{background:#22324A;box-shadow:inset 0 0 0 1px #33465F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .runbar{background:#22324A;box-shadow:inset 0 0 0 1px #33465F}}
.runbar .btn.primary{background:var(--lime);color:#0A3324;border-color:transparent}

.fab{background:color-mix(in srgb,#15233B 72%,transparent)}
.fab:hover{background:color-mix(in srgb,#15233B 88%,transparent)}
.wcard{background:linear-gradient(135deg,#15233B 0%,#1F3A66 100%)}
.toast button,:root[data-theme="light"] .toast button{color:var(--lime)}
:root[data-theme="dark"] .toast button{color:#0F8F62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#0F8F62}}

/* Status colours keep strict meanings */
.notice{border-left-color:var(--lav)}
.notice.warm{border-left-color:var(--amber)}
.chip{font-weight:600}
.streak{background:var(--lime);color:var(--on-lime)}
.wk .bar.met span{background:var(--teal)}
.heat i.l4{background:var(--teal)}
.stat.hl{background:var(--pri);color:var(--on-pri)}.stat.hl span{color:var(--on-pri);opacity:.8}
.heat i.l1{background:color-mix(in srgb,var(--teal) 28%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--teal) 52%,var(--soft))}
.heat i.l3{background:color-mix(in srgb,var(--teal) 76%,var(--soft))}
.wk:not(p){text-transform:none;letter-spacing:0;font-weight:inherit;font-size:inherit;margin:0}
#td-signin{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.td-si{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:32px 26px;max-width:400px;text-align:center;display:grid;gap:14px;justify-items:center}
.td-si-logo{width:64px;height:64px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-size:2rem;font-weight:800}
.td-si p{color:var(--ink2)}
.td-si-btn{display:inline-flex;align-items:center;gap:10px;background:var(--pri);color:var(--on-pri);border-radius:999px;padding:12px 22px;text-decoration:none;font-weight:700}
.td-si-back{font-weight:600;font-size:.9rem;color:var(--ink2)}

<script>
// Ta-Done! standalone runtime: gives the app its storage, Google tools, uploads and downloads
// from this website's own backend (/api), instead of claude.ai.
(function () {
  'use strict';
  const API = '/api';
  const signedOut = () => { showSignIn(); return new Promise(() => { }); };
  async function call(path, opts) {
    let r;
    try { r = await fetch(API + path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts || {})); }
    catch (e) { throw { code: 'unavailable', message: 'You seem to be offline.' }; }
    if (r.status === 401) { showSignIn(); throw { code: 'signed_out', message: 'Signed out' }; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw (d.error || { code: r.status >= 500 ? 'unavailable' : 'tool_error', message: r.statusText });
    return d;
  }
  function showSignIn() {
    if (document.getElementById('td-signin')) return;
    const box = document.createElement('div'); box.id = 'td-signin';
    box.innerHTML = `<div class="td-si"><div class="td-si-logo">✓</div><h1>Ta-Done!</h1><p>Sign in with your Google account to open your dashboard. Your calendar, tasks and Drive connect at the same time.</p>
      <a class="td-si-btn" href="${API}/auth/login"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</a>
      <a class="td-si-back" href="/">Back to workwithdorothy.com</a></div>`;
    document.body.appendChild(box);
  }

  // ---------- Database: one private collection, synced across devices ----------
  function makeDb() {
    const local = new Map();       // id -> data
    const ver = new Map();         // id -> server "updated" stamp we hold
    const pending = new Map();     // id -> count of writes in flight
    let cursor = 0, listeners = [], timer = null, started = false, lastOk = 0;
    const snap = () => ({ docs: [...local.entries()].map(([id, data]) => ({ id, data: () => data })), metadata: { fromCache: false, hasPendingWrites: [...pending.values()].some(n => n > 0) } });
    const emit = () => { const s = snap(); listeners.forEach(l => { try { l.cb(s); } catch (e) { console.error(e); } }); };
    async function poll() {
      clearTimeout(timer);
      try {
        const d = await call('/db/snap?since=' + cursor);
        let changed = false;
        for (const doc of d.docs) {
          if ((pending.get(doc.id) || 0) > 0) continue;            // our own newer write is on its way
          if ((ver.get(doc.id) || 0) >= doc.updated) continue;       // already have it
          local.set(doc.id, doc.data); ver.set(doc.id, doc.updated); changed = true;
        }
        const live = new Set(d.ids);
        for (const id of [...local.keys()]) if (!live.has(id) && !(pending.get(id) > 0)) { local.delete(id); ver.delete(id); changed = true; }
        cursor = d.cursor; lastOk = Date.now();
        if (changed || !started) { started = true; emit(); }
        window.dispatchEvent(new CustomEvent('tadone-sync', { detail: { ok: true, at: lastOk } }));
      } catch (e) {
        if (e && e.code === 'signed_out') return;
        if (!started) listeners.forEach(l => l.err && l.err(e));
        window.dispatchEvent(new CustomEvent('tadone-sync', { detail: { ok: false, at: lastOk } }));
      }
      timer = setTimeout(poll, document.hidden ? 60000 : 4000);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && started) poll(); });
    window.addEventListener('online', () => started && poll());
    async function write(id, data) {
      pending.set(id, (pending.get(id) || 0) + 1);
      if (data === null) local.delete(id); else local.set(id, data);
      emit();
      try {
        const r = data === null ? await call('/db/doc/' + encodeURIComponent(id), { method: 'DELETE' })
          : await call('/db/doc/' + encodeURIComponent(id), { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data }) });
        if (data !== null) ver.set(id, r.updated); else ver.delete(id);
      } finally { pending.set(id, pending.get(id) - 1); }
    }
    return {
      collection() {
        return {
          doc: id => ({ set: data => write(id, JSON.parse(JSON.stringify(data))), delete: () => write(id, null) }),
          onSnapshot(cb, err) { const l = { cb, err }; listeners.push(l); if (!started) poll(); else cb(snap()); return () => { listeners = listeners.filter(x => x !== l); }; },
        };
      },
      refresh: poll,
    };
  }

  // ---------- Tools (Google + weather), with simple caching and live refresh ----------
  function makeMcp() {
    const cache = new Map(), watchers = new Set();
    const keyOf = (s, t, i) => s + '|' + t + '|' + JSON.stringify(i || {});
    async function callTool(server, tool, input, opts) {
      const k = keyOf(server, tool, input), c = cache.get(k), stale = (opts && opts.cache && opts.cache.staleTime) || 0;
      if (c && opts && opts.cache !== false && stale && Date.now() - c.at < stale) return { payload: c.payload, cache: { storedAt: c.at } };
      const d = await call('/tool', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ server, tool, input }) });
      cache.set(k, { payload: d.payload, at: Date.now() });
      return { payload: d.payload, cache: { storedAt: Date.now() } };
    }
    function watchTool(server, tool, input, cb, opts) {
      const w = { server, tool, stopped: false, t: null };
      const run = async () => {
        clearTimeout(w.t); if (w.stopped) return;
        try { const r = await callTool(server, tool, input, { cache: (opts && opts.cache) || false }); if (!w.stopped) cb({ type: 'data', result: r }); }
        catch (e) { if (!w.stopped && e && e.code !== 'signed_out') cb({ type: 'error', error: e }); }
        if (!w.stopped) w.t = setTimeout(run, (opts && opts.refetchInterval) || 300000);
      };
      w.run = () => { const k = keyOf(server, tool, input); cache.delete(k); run(); };
      watchers.add(w); run();
      return () => { w.stopped = true; clearTimeout(w.t); watchers.delete(w); };
    }
    function invalidate(server, tool) {
      for (const k of [...cache.keys()]) if (k.startsWith(server + '|' + (tool ? tool + '|' : ''))) cache.delete(k);
      watchers.forEach(w => { if (w.server === server && (!tool || w.tool === tool)) w.run(); });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) watchers.forEach(w => { if (w.server === 'Google Calendar') w.run(); }); });
    return { callTool, watchTool, invalidate };
  }

  const assets = {
    async upload(blob, o) { const r = await fetch(API + '/blob', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': (o && o.type) || blob.type || 'image/png' }, body: blob }); const d = await r.json().catch(() => ({})); if (!r.ok) throw (d.error || { code: 'tool_error' }); return { id: d.id }; },
    async delete(id) { await call('/blob/' + encodeURIComponent(id), { method: 'DELETE' }); },
  };
  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); return { status: 'saved' };
    },
  };

  let me = null, mePromise = null, dbInst = null, mcpInst = null;
  const whoAmI = () => mePromise || (mePromise = call('/auth/me').then(d => (me = d)).catch(e => { if (e && e.code === 'signed_out') return signedOut(); throw e; }));
  window.TADONE = { me: () => me, whoAmI, call, refresh: () => dbInst && dbInst.refresh() };
  window.claude = {
    async use(name) {
      await whoAmI();
      if (name === 'db') return dbInst || (dbInst = makeDb());
      if (name === 'user') return { id: async () => 'me', profile: async () => me };
      if (name === 'mcp') return mcpInst || (mcpInst = makeMcp());
      if (name === 'assets') return assets;
      if (name === 'downloads') return downloads;
      return null;
    },
  };
})();

</script>
<script>
(() => {
'use strict';
// ---------- Time: follows the chosen time zone (device time zone by default) ----------
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const deviceTZ = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } };
let TZ = deviceTZ(), TZF = null;
function setTZ(tz) { let ok = tz; try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); } catch (e) { ok = deviceTZ(); } if (ok !== TZ) { TZ = ok; TZF = null; } }
function tzParts(ms) {
  if (!TZF) TZF = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const o = {}; for (const p of TZF.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second };
}
const tzOffset = ms => { const p = tzParts(ms); return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - (ms - (((ms % 1000) + 1000) % 1000)); };
const ymd = k => k.split('-').map(Number);
const utcOf = k => { const [y, m, d] = ymd(k); return Date.UTC(y, m - 1, d); };
const dayKey = ms => { const p = tzParts(ms); return p.y + '-' + pad(p.mo) + '-' + pad(p.d); };
const dayStart = k => { const t = utcOf(k); const o = tzOffset(t); let r = t - o; const o2 = tzOffset(r); if (o2 !== o) r = t - o2; return r; };
const addDays = (k, n) => new Date(utcOf(k) + n * DAY).toISOString().slice(0, 10);
const dayEnd = k => dayStart(addDays(k, 1));
const monthKey = ms => dayKey(ms).slice(0, 7);
const dow = k => new Date(utcOf(k)).getUTCDay();
const weekStart = k => addDays(k, -((dow(k) + 6) % 7));
const daysBetween = (a, b) => Math.round((utcOf(b) - utcOf(a)) / DAY);
const hourIn = ms => tzParts(ms).h;
const hm = ms => { const p = tzParts(ms); let h = p.h; const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return h + ':' + pad(p.mi) + ' ' + ap; };
const hm24 = ms => { const p = tzParts(ms); return pad(p.h) + ':' + pad(p.mi); };
const t12 = s => { if (!s) return ''; let [h, m] = s.split(':').map(Number); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const prettyDay = k => new Date(utcOf(k)).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });
const shortDay = k => new Date(utcOf(k)).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const dateOnly = k => new Date(utcOf(k)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
const today = () => dayKey(Date.now());
const mins = ms => Math.floor(ms / 60000);
const dur = ms => { const m = Math.round(ms / 60000); if (m < 60) return m + 'm'; return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const goalTxt = m => m >= 60 ? (m % 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : (m / 60) + 'h') : m + 'm';
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(x); };
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// ---------- Icons ----------
const P = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',

function heatmapHTML(now) {

function viewWeeklyReview(seg) {

  const done = S.tasks.filter(t => t.done && t.doneAt && inW(t.doneAt));

  const added = S.tasks.filter(t => inW(t.createdAt)).length;

  const stuck = S.tasks.filter(t => !t.done && t.moves.length >= 3).sort((a, b) => b.moves.length - a.moves.length).slice(0, 5);
  let focus = 0, daysActive = 0; for (let i = 0; i < 7; i++) { const d = addDays(w0, i); if (d > k) break; const m = allDayMs(d, now); focus += m; if (m > 0) daysActive++; }

  const rv = S.reviews[wk] || {};

  const jCount = allEntries().filter(e => e.day >= w0 && e.day <= w1).length;
  const label = reviewOff === 0 ? 'This week' : reviewOff === -1 ? 'Last week' : 'Week of ' + dateOnly(w0);
  return `

    <div class="row">${seg}<button class="btn sm" data-act="rev-week" data-v="-1" aria-label="Previous week">‹</button><b>${esc(label)}</b><button class="btn sm" data-act="rev-week" data-v="1" ${reviewOff >= 0 ? 'disabled' : ''} aria-label="Next week">›</button></div></header>

    <div class="stat"><b class="num">${added}</b><span>Tasks added</span></div>

    <div class="stat"><b class="num">${ratio ? (ratio).toFixed(1) + '×' : 'No data'}</b><span>Actual time vs. estimate</span></div>
    <div class="stat"><b class="num">${apps}</b><span>Job applications sent</span></div>
    ${priv() ? '' : `<div class="stat"><b class="num">${moodAvg}</b><span>Usual mood (${moodN} check-ins)</span></div>
    <div class="stat"><b class="num">${jCount}</b><span>Journal entries</span></div>`}
  </div>${ratio ? `<p class="muted small" style="margin-top:10px">${ratio > 1.2 ? 'Tasks took longer than you guessed. Try padding estimates a little.' : ratio < 0.8 ? 'You\'re faster than your estimates. You can plan a bit more per day.' : 'Your estimates are close to reality. Nice.'}</p>` : ''}</section>
  <div class="grid2 even">
    <section class="panel"><h2 style="margin-bottom:12px">Activities vs. goals</h2><div class="wk">${weekBars(w0, now)}</div></section>
    <section class="panel"><h2 style="margin-bottom:6px">Tasks that keep getting moved</h2>
      ${stuck.length ? `<ul class="tasks">${stuck.map(t => `<li class="task"><div class="body"><div class="ttl" style="cursor:default">${esc(t.title)}</div><div class="meta"><span class="chip stuck">Moved ${t.moves.length} times</span></div></div><button class="btn sm" data-act="open-task" data-id="${t.id}">Break it down</button></li>`).join('')}</ul>` : '<p class="empty">Nothing stuck. Everything is moving.</p>'}</section>

// ---------- Streaks ----------
function showedUp(d, now) {
  if (allDayMs(d, now) >= 5 * 60000) return true;
  if (S.tasks.some(t => t.done && t.doneAt && dayKey(t.doneAt) === d)) return true;
  if ((J[d.slice(0, 7)] || []).some(e => e.day === d)) return true;
  return false;
}
function mainStreak(now) {
  const k = today(), first = S.createdAt ? dayKey(S.createdAt) : k;
  let cur = 0, d = k;
  if (showedUp(k, now)) cur++;
  d = addDays(k, -1);
  for (let i = 0; i < 800 && d >= first; i++) { if (isRest(d) && !showedUp(d, now)) { d = addDays(d, -1); continue; } if (showedUp(d, now)) { cur++; d = addDays(d, -1); } else break; }
  let best = cur, run = 0; d = first;
  for (let i = 0; i < 800 && d <= k; i++) { if (showedUp(d, now)) { run++; best = Math.max(best, run); } else if (!isRest(d)) run = 0; d = addDays(d, 1); }
  return { cur, best };
}

function alphaBox(bmp) {

  c.getContext('2d').drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);

}
